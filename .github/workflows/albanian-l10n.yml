name: Kontrolli i përkthimeve shqip
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shqip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifiko burimet shqipe
        run: python scripts/check_albanian_translations.py
      - name: Kontrollo interpolimet e dyshimta Kotlin
        run: python scripts/check_kotlin_interpolation.py
