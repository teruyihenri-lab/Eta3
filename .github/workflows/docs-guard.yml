name: Kontrolli i dokumentacionit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dokumentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollo skedaret
        run: python scripts/check_docs_update.py --check-files
      - name: Verifiko burimet e gjuhës shqipe
        run: python scripts/check_albanian_resources.py
      - name: Kontrollo historikun e ndryshimeve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python scripts/check_docs_update.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
