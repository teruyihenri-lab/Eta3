name: Auditimi i teksteve në Kotlin
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gjej literale të mundshme në UI dhe zë
        run: python scripts/audit_localization_literals.py
